<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="760" viewBox="0 0 1280 760" role="img" aria-label="LIMBUZZ V1 — SOS Emergency Sequence">
<rect width="1280" height="760" fill="#fbfdff"/>
<text x="56" y="62" font-family="Inter,Arial,sans-serif" font-size="30" font-weight="700" fill="#263238">LIMBUZZ V1 — SOS Emergency Sequence</text>
<text x="56" y="92" font-family="Inter,Arial,sans-serif" font-size="15" fill="#607d8b">SMS dispatch is independent of location timing and internet connectivity</text>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#90a4ae"/></marker></defs>
<text x="120" y="145" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="16" font-weight="600" fill="#263238">User</text>
<path d="M120 165 L120 690" stroke="#90a4ae" stroke-width="1.5" stroke-dasharray="5 7"/>
<text x="350" y="145" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="16" font-weight="600" fill="#263238">Flutter UI</text>
<path d="M350 165 L350 690" stroke="#90a4ae" stroke-width="1.5" stroke-dasharray="5 7"/>
<text x="590" y="145" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="16" font-weight="600" fill="#263238">Foreground service</text>
<path d="M590 165 L590 690" stroke="#90a4ae" stroke-width="1.5" stroke-dasharray="5 7"/>
<text x="840" y="145" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="16" font-weight="600" fill="#263238">Native SMS / call</text>
<path d="M840 165 L840 690" stroke="#90a4ae" stroke-width="1.5" stroke-dasharray="5 7"/>
<text x="1100" y="145" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="16" font-weight="600" fill="#263238">Contacts</text>
<path d="M1100 165 L1100 690" stroke="#90a4ae" stroke-width="1.5" stroke-dasharray="5 7"/>
<path d="M120 195 L350 195" fill="none" stroke="#90a4ae" stroke-width="2" marker-end="url(#arrow)"/>
<text x="235.0" y="187.0" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="13" fill="#607d8b">hold SOS 3s</text>
<path d="M350 255 L590 255" fill="none" stroke="#90a4ae" stroke-width="2" marker-end="url(#arrow)"/>
<text x="470.0" y="247.0" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="13" fill="#607d8b">start session</text>
<path d="M590 315 L840 315" fill="none" stroke="#90a4ae" stroke-width="2" marker-end="url(#arrow)"/>
<text x="715.0" y="307.0" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="13" fill="#607d8b">send SMS to all</text>
<path d="M840 375 L1100 375" fill="none" stroke="#90a4ae" stroke-width="2" marker-end="url(#arrow)"/>
<text x="970.0" y="367.0" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="13" fill="#607d8b">deliver emergency SMS</text>
<path d="M590 435 L350 435" fill="none" stroke="#90a4ae" stroke-width="2" marker-end="url(#arrow)"/>
<text x="470.0" y="427.0" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="13" fill="#607d8b">show per-contact status</text>
<path d="M590 495 L840 495" fill="none" stroke="#90a4ae" stroke-width="2" marker-end="url(#arrow)"/>
<text x="715.0" y="487.0" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="13" fill="#607d8b">call primary contact</text>
<path d="M840 555 L1100 555" fill="none" stroke="#90a4ae" stroke-width="2" marker-end="url(#arrow)"/>
<text x="970.0" y="547.0" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="13" fill="#607d8b">deliver voice call</text>
<path d="M120 615 L350 615" fill="none" stroke="#90a4ae" stroke-width="2" marker-end="url(#arrow)"/>
<text x="235.0" y="607.0" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="13" fill="#607d8b">cancel</text>
<path d="M350 655 L590 655" fill="none" stroke="#90a4ae" stroke-width="2" marker-end="url(#arrow)"/>
<text x="470.0" y="647.0" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="13" fill="#607d8b">stop + all-clear</text>
<rect x="700" y="205" width="280" height="74" rx="12" fill="#def5e7" stroke="#2e8b57" stroke-width="2"/>
<text x="840" y="232" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="15" font-weight="600" fill="#263238">Parallel</text><text x="840" y="255" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="13" fill="#607d8b">location waits max 10s · audio starts</text>
</svg>