<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 860" role="img" aria-labelledby="context-title context-desc">
    <title id="context-title">LIMBUZZ V1 system context</title>
    <desc id="context-desc">A repository-owned companion to the V1 Mermaid system context, showing the React Native and Expo app, typed emergency platform layer, Kotlin Android integrations, future Swift iOS integrations, local storage, foreground service, platform capabilities, cellular transport, contacts, maps and a technology-agnostic backend API boundary.</desc>
    <defs><style>@import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;display=swap');.title{font:400 32px 'Instrument Serif',Georgia,serif;fill:#2d3142}.eyebrow,.tag,.edge,.legend,.lane{font:10px 'Geist Mono',monospace;letter-spacing:.08em;fill:#4f5d75}.name{font:600 15px Geist,Arial,sans-serif;fill:#2d3142}.copy{font:12px Geist,Arial,sans-serif;fill:#4f5d75}</style>
      <marker id="context-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0,8 3,0 6" fill="#4f5d75"/></marker>
      <marker id="context-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0,8 3,0 6" fill="#eb6c36"/></marker>
      <marker id="context-arrow-reverse" markerWidth="8" markerHeight="6" refX="1" refY="3" orient="auto"><polygon points="8 0,0 3,8 6" fill="#4f5d75"/></marker>
      <marker id="context-arrow-reverse-accent" markerWidth="8" markerHeight="6" refX="1" refY="3" orient="auto"><polygon points="8 0,0 3,8 6" fill="#eb6c36"/></marker>
    </defs>
    <rect width="1280" height="860" fill="#f5f5f5"/>
    <text class="eyebrow" x="48" y="52">ARCHITECTURE · V1 SYSTEM CONTEXT</text>
    <text class="title" x="48" y="92">What LIMBUZZ owns, and what it depends on</text>
    <text class="copy" x="48" y="120">The emergency path stays on the Android device until the cellular network reaches trusted contacts.</text>

