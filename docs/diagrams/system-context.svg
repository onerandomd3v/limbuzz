    <rect x="48" y="780" width="1184" height="1" fill="#2d3142" fill-opacity="0.18"/>
    <text class="legend" x="48" y="812">BOUNDARY RULE</text><text class="copy" x="150" y="812">Emergency SMS and voice use the cellular network; the TBD Backend API never sits on the offline SOS critical path.</text>
