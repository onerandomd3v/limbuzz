<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="760" viewBox="0 0 1280 760" role="img" aria-label="LIMBUZZ V1 — Local Data Model">
<rect width="1280" height="760" fill="#fbfdff"/>
<text x="56" y="62" font-family="Inter,Arial,sans-serif" font-size="30" font-weight="700" fill="#263238">LIMBUZZ V1 — Local Data Model</text>
<text x="56" y="92" font-family="Inter,Arial,sans-serif" font-size="15" fill="#607d8b">Guest-safe persistence with optional identity linking</text>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#90a4ae"/></marker></defs>
<rect x="70" y="170" width="240" height="150" rx="14" fill="#d9efff" stroke="#1976d2" stroke-width="2"/>
<text x="190.0" y="240.0" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="18" font-weight="600" fill="#263238">USER_PROFILE</text>
<text x="190.0" y="265.0" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="13" fill="#607d8b">optional Google identity</text>
<rect x="390" y="120" width="270" height="190" rx="14" fill="#fff0d6" stroke="#ef8b22" stroke-width="2"/>
<text x="525.0" y="210.0" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="18" font-weight="600" fill="#263238">EMERGENCY_CONTACT</text>
<text x="525.0" y="235.0" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="13" fill="#607d8b">1–5 local contacts · primary flag</text>
<rect x="390" y="430" width="270" height="190" rx="14" fill="#ffe1e1" stroke="#c62828" stroke-width="2"/>
<text x="525.0" y="520.0" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="18" font-weight="600" fill="#263238">EMERGENCY_SESSION</text>
<text x="525.0" y="545.0" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="13" fill="#607d8b">ACTIVE / CLOSED · location snapshot</text>
<rect x="760" y="170" width="270" height="190" rx="14" fill="#def5e7" stroke="#2e8b57" stroke-width="2"/>
<text x="895.0" y="260.0" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="18" font-weight="600" fill="#263238">SESSION_ACTION</text>
<text x="895.0" y="285.0" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="13" fill="#607d8b">SMS · CALL · LOCATION · AUDIO</text>
<rect x="760" y="480" width="270" height="150" rx="14" fill="#fff0d6" stroke="#ef8b22" stroke-width="2"/>
<text x="895.0" y="550.0" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="18" font-weight="600" fill="#263238">AUDIO_RECORDING</text>
<text x="895.0" y="575.0" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="13" fill="#607d8b">private local path · share/delete</text>
<path d="M310 245 L390 215" fill="none" stroke="#90a4ae" stroke-width="2" marker-end="url(#arrow)"/>
<text x="350.0" y="222.0" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="13" fill="#607d8b">owns</text>
<path d="M310 275 L390 510" fill="none" stroke="#90a4ae" stroke-width="2" marker-end="url(#arrow)"/>
<text x="350.0" y="384.5" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="13" fill="#607d8b">starts</text>
<path d="M660 220 L760 240" fill="none" stroke="#90a4ae" stroke-width="2" marker-end="url(#arrow)"/>
<text x="710.0" y="222.0" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="13" fill="#607d8b">receives</text>
<path d="M660 525 L760 270" fill="none" stroke="#90a4ae" stroke-width="2" marker-end="url(#arrow)"/>
<text x="710.0" y="389.5" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="13" fill="#607d8b">records</text>
<path d="M660 560 L760 550" fill="none" stroke="#90a4ae" stroke-width="2" marker-end="url(#arrow)"/>
<text x="710.0" y="547.0" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="13" fill="#607d8b">contains</text>
<text x="70" y="700" font-family="Inter,Arial,sans-serif" font-size="14" fill="#607d8b">Nullable user_profile_id keeps guest mode first-class; the database is the recovery source of truth.</text>
</svg>